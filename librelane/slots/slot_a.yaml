# Slot A -- standalone development/test configuration for Team Maxilerator's
# systolic-array accelerator.
#
# This file provides a SELF-CONTAINED representation of Slot A for RTL-to-GDS
# development, synthesis, place-and-route, timing analysis, and dry-run
# physical implementation. It is not intended to define the final integrated
# multi-team Chipathon padframe.
#
# The Slot A interface and pad allocation used here were developed based on
# the available Chipathon/padframe guidelines. The design currently uses a
# total of 22 pad positions, including clk_pad and rst_n_pad:
#
#     12 bidirectional pads (gf180mcu_fd_io__bi_24t)
#         - data[7:0]
#         - a_ready_o
#         - b_ready_o
#         - out_valid_o
#         - out_last_o
#
#      5 input pads (gf180mcu_fd_io__in_c)
#         - a_valid_i
#         - a_last_i
#         - b_valid_i
#         - b_last_i
#         - out_ready_i
#
#      1 analog pad (gf180mcu_fd_io__asig_5p0)
#         - currently unused; retained as an analog placeholder
#
#      1 DVDD pad
#      1 DVSS pad
#      2 dedicated input pads
#         - clk_pad
#         - rst_n_pad
#
# For the standalone development model, the functional pads are currently
# placed on the SOUTH and WEST sides. NORTH and EAST are populated only as
# required to complete the standalone padring. The final pad locations and
# pad indices within the shared Chipathon padframe are subject to the final
# integration definition.
#
# IMPORTANT -- TEMPORARY FLOORPLAN:
#
# The official DIE_AREA and CORE_AREA for Slot A have not yet been finalized/
# confirmed by the Chipathon integration team. Until those dimensions are
# provided, this configuration intentionally reuses the default dimensions
# from slot_workshop.yaml:
#
#     DIE_AREA:  [0, 0, 2935, 2935]
#     CORE_AREA: [442, 442, 2493, 2493]
#
# These dimensions are therefore DEVELOPMENT/DRY-RUN values only and must not
# be interpreted as the final physical dimensions allocated to Slot A.
#
# The above temporary floorplan has been used successfully for a complete
# LibreLane RTL-to-GDS dry run of the accelerator. Once the official Slot A
# geometry and shared-padframe placement are confirmed, DIE_AREA, CORE_AREA,
# and any integration-dependent pad-placement constraints will be updated
# accordingly.
#
# Index mapping for the generated input[i] and bidir[i] connections is defined
# in chip_top.sv / chip_core.sv.

# Floorplanning
FP_SIZING: absolute
DIE_AREA:  [0, 0, 2935, 2935]
CORE_AREA: [442, 442, 2493, 2493]

VERILOG_DEFINES: ["SLOT_A"]

# Pad lists read clockwise from the south-west corner. NORTH and EAST are
# empty -- those 2 sides face inward toward neighboring blocks in the real
# integrated die and carry no pads here. Capped at 11 pads per side.

# ----- South: SW -> SE (11 pads) -----
PAD_SOUTH: [
    "bidir\\[0\\].pad",
    "bidir\\[1\\].pad",
    "bidir\\[2\\].pad",
    "bidir\\[3\\].pad",
    "bidir\\[4\\].pad",
    "bidir\\[5\\].pad",
    "bidir\\[6\\].pad",
    "bidir\\[7\\].pad",
    "bidir\\[10\\].pad",
    "bidir\\[11\\].pad",

    "inputs\\[4\\].pad",
]

# ----- East: SE -> NE (empty -- inward-facing side) -----
PAD_EAST: []

# ----- North: NE -> NW (empty -- inward-facing side) -----
PAD_NORTH: []

# ----- West: NW -> SW (11 pads) -----
PAD_WEST: [
    "dvdd_pads\\[0\\].pad",
    "dvss_pads\\[0\\].pad",

    "analog\\[0\\].pad",

    rst_n_pad,
    clk_pad,

    "inputs\\[1\\].pad",
    "inputs\\[0\\].pad",

    "bidir\\[8\\].pad",
    "bidir\\[9\\].pad",

    "inputs\\[2\\].pad",
    "inputs\\[3\\].pad",
]
